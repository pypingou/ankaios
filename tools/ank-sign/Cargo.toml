[package]
name = "ank-sign"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "CLI tool for signing Ankaios manifests with Ed25519"
authors = ["Elektrobit Automotive GmbH and Ankaios contributors"]

[[bin]]
name = "ank-sign"
path = "src/main.rs"

[dependencies]
ed25519-dalek = "2.0"
rand = "0.9"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
base64 = "0.22"
anyhow = "1.0"

[dev-dependencies]
tempfile = "3.17"
